[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpfsl"
version = "0.1.0"
description = "Starter project scaffold for MPFSL research and experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Your Name" }
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pytest>=7.0",
  "torch>=2.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "black>=24.0",
  "pytest-cov>=4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
